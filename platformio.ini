; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3usbotg]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32s3usbotg
framework = arduino
upload_port = COM5
monitor_speed = 115200
monitor_port = COM5
upload_protocol = esp-builtin
debug_speed = 20000
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_osc = 40000000L
board_build.f_flash = 80000000L
board_build.flash_size = 32MB
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32mb.csv
board_build.arduino.memory_type = opi_opi

build_flags = 
	; -DCONFIG_NEWLIB_NANO_FORMAT=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM=1
	-DCONFIG_SPIRAM=1
	-DCONFIG_SPIRAM_MODE_OCT=1
	-DCONFIG_SPIRAM_SPEED_120=1
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
	-Isrc
	-Isrc/LVGL_Driver
	-Isrc/LCD_Driver
	-Isrc/application
	-Isrc/application/ui

build_src_filter =
	+<*>
	-<uiexport/>
	-<application/ui_menu/>
lib_deps = 
	lvgl/lvgl@^9.5.0
